[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "plugins",
    "plugins.v2",
    "plugins.v3",
    "tests",
]
extend-exclude = [
    "**/.*",
    "**/node_modules",
    "__pycache__",
    "docs",
]

[tool.ruff.lint]
select = [
    "I",
    "E",
    "F",
    "W",
    "I",
    "B",
    "D",
    "UP",
    "C90",
    "N",
    "SIM",
    "ASYNC",
]
fixable = ["ALL"]
unfixable = []
ignore = ["D104"]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = [
    "plugins",
    "plugins.v2",
    "plugins.v3",
    "tests",
]
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
show_error_codes = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
exclude = [
    "^docs/",
    "^venv/",
]

[tool.pyright]
include = [
    "plugins",
    "plugins.v2",
    "plugins.v3",
    "tests",
]
exclude = [
    "**/.*",
    "**/node_modules",
    "**/__pycache__",
    "docs",
]
extraPaths = [
    ".",
    "./plugins",
    "./plugins.v2",
    "./plugins.v3",
    "./tests",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"
reportUnknownReturnType = "none"
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUnusedCoroutine = "warning"

[tool.pytest.ini_options]
# 仅在仓库根 tests/ 下发现用例；各代 plugins 目录不再承载测试
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Test", "Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"
# 各代必须分会话运行（同名插件包冲突）；marker 供后续按代筛选扩展使用
markers = [
    "v1: v1 插件（plugins/）单测，需与 v2 分独立会话运行",
    "v2: v2 插件（plugins.v2/）单测，需与 v1 分独立会话运行",
    "v3: v3 插件（plugins.v3/）单测，需与其他代分独立会话运行",
]
# 仅忽略主程序依赖链或三方库在 Python 3.12 下的已知弃用告警；插件仓自身告警应直接修复
filterwarnings = [
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
