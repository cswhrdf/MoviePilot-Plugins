name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pyright 的 PyPI 包在运行时依赖 Node。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Type check
        run: uv run --no-sync pyright
